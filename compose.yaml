services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set, copy .env.example to .env}
      POSTGRES_DB: uptime_monitor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
volumes:
  db-data:
